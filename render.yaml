services:
  # 1. Django Backend Web Service
  - type: web
    name: mintana-crm-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mintana-crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

      # --- Brevo Email Configuration ---
      - key: BREVO_API_KEY
        sync: false   # Set this secret manually in the Render dashboard
      - key: DEFAULT_FROM_EMAIL
        value: "mintanacrm@gmail.com"
      - key: SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "True"
      - key: SMTP_USER
        value: "mintanacrm@gmail.com"
      - key: SMTP_PASS
        sync: false   # Set this secret manually in the Render dashboard

      # --- Frontend URL (for email action buttons) ---
      - key: FRONTEND_URL
        value: "https://mintana-crm-frontend.onrender.com"

  # 2. React Vite Frontend Static Site
  - type: web
    name: mintana-crm-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://mintana-crm-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: mintana-crm-db
    databaseName: mintana_crm
    user: mintana_user
