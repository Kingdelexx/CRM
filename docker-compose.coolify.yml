version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mintana_crm}
      POSTGRES_USER: ${POSTGRES_USER:-mintana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crm-net

  # 2. Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      SECRET_KEY: ${SECRET_KEY:?Django secret key required}
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-mintana_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mintana_crm}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      FRONTEND_URL: ${FRONTEND_URL}
      # Brevo Email Configuration
      BREVO_API_KEY: ${BREVO_API_KEY}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-mintanacrm@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
      SMTP_USER: ${SMTP_USER:-mintanacrm@gmail.com}
      SMTP_PASS: ${SMTP_PASS}
    networks:
      - crm-net

  # 3. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: always
    depends_on:
      - backend
    networks:
      - crm-net

volumes:
  pgdata:

networks:
  crm-net:
    driver: bridge
